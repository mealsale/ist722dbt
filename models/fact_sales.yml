version: 2

models:
  - name: fact_sales
    description: Sales fact table. One row per product per order.
    columns:
      - name: saleskey
        description: Surrogate key for the sales fact row
        tests:
          - not_null
          - unique
      - name: employeekey
        description: Dimension key for dim_employee
      - name: customerkey
        description: Dimension key for dim_customer
      - name: datekey
        description: Dimension key for dim_date based on order date
      - name: productkey
        description: Dimension key for dim_product
      - name: orderid
        description: Degenerate dimension for the order
        tests:
          - not_null
      - name: quantity
        description: Quantity ordered
      - name: extendedpriceamount
        description: Quantity times UnitPrice
      - name: discountamount
        description: Quantity times UnitPrice times Discount
      - name: soldamount
        description: Quantity times UnitPrice times (1 minus Discount)